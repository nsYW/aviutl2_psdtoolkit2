name: releaser

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+alpha[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+beta[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Get the version
        id: get_version
        shell: bash
        run: |
          echo "tag=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT
      - name: Build
        shell: bash
        run: |
          docker run --net host --rm -i -v .:/root/repo -w /root/repo ubuntu:22.04 /bin/bash -c 'apt update && apt install -y git curl unzip && git config --system --add safe.directory "*" && LANG="C.UTF-8" TZ="JST-9" bash build.bash --skip-tests && LANG="C.UTF-8" TZ="JST-9" bash build.bash --zip'
      - name: Attest build artifacts
        id: attest-zip
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: "build/Release/dist/psdtoolkit_*.au2pkg.zip"
      - name: Prepare attestation for upload
        shell: bash
        run: |
          VERSION="${{ steps.get_version.outputs.tag }}"
          mkdir -p attestations
          cp "${{ steps.attest-zip.outputs.bundle-path }}" "attestations/psdtoolkit_${VERSION}.au2pkg.zip.attestation.jsonl"
      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.CREATE_RELEASE_SECRET }}
          VERSION: ${{ steps.get_version.outputs.tag }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -a
          source build/Release/x86_64/src/c/version.env
          set +a
          envsubst < .github/RELEASE_TEMPLATE.md > release_notes.md
          gh release create "${VERSION}" \
            --draft \
            --title "${VERSION}" \
            --notes-file release_notes.md \
            "build/Release/dist/psdtoolkit_${VERSION}.au2pkg.zip" \
            "attestations/psdtoolkit_${VERSION}.au2pkg.zip.attestation.jsonl"
